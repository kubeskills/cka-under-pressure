apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app-template
# Identity labels go on the Deployment, its selector, and its Pod template.
labels:
  - pairs:
      app.kubernetes.io/name: web
      tier: frontend
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: web
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: web
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: web
