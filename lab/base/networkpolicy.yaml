# Namespace scaffolding: accept ingress only from Pods in the same namespace.
# Egress is unrestricted. Whether the policy is enforced depends on the cluster's
# CNI; the lab does not rely on enforcement either way.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
