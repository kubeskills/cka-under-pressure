apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app-template
# Deliberately shares the `tier` label with web, so a selector that is too
# broad routes traffic to the wrong application.
labels:
  - pairs:
      app.kubernetes.io/name: report
      tier: frontend
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: report
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: report
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: report
